name: Lint Files

on:
  push:
    branches: "main"
  pull_request:
    branches: "**"

jobs:
  run-eslint:
    name: Run ESLint and Stylelint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run ESLint and Stylelint
        run: npm run lint
